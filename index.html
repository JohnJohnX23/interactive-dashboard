<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <h1> My Interactive Dashboard</h1>
    <p>This dashboard was created by John Price for WEB-115 course at waketech.
        <link rel="stylesheet" href="css/style.css">
    
    <script>
    document.write("This dashboard demonstrates how JavaScript can be used to create interactive websites.");
    </script>
    <!--The <noscript> is for web browsersnwith JavaScript rendering disabled. -->
    <noscript>
        unfortunatley, your web browser does not support JavaScript.
    </noscript>
    <div class="container">
    <div class="row">
        <!-- Dashboard Content -->
         <div {
            class:"col";
            id:"weekley-task";
            <script src="task-manager.js"></script>
            <h2 class="heading">Weekly Task</h2>
                <label for="Name">Name:</label><br>
                <input type="text" id="Name" name="Name"><br>
                <label for="Goal">Daily Task Goal:</label><br>
                <input type="number" id="Goal" name="Goal"><br>
                <label for="Bonus">Weekly Bonus:</label><br>
                <input type="number" id="Bonus" name="Bonus"><br>
                <button onclick="weeklyGoal()" >Set Goals</button>
                
            </form>
            <p style="color: black;" id="goal-message"></p>

        </div>
        <div class="col" ID="metric-converter">
            <h2 class="heading">Metric Converter</h2>
            <label for="number">Number:</label><br>
            <input type="number" id="number" name="number"><br>
            <label for="unit1">From Unit:</label><br>
            <select id="unit1" name="unit1">
                <option value="inch">Inch</option>
                <option value="foot">Foot</option>
                <option value="yard">Yard</option>
                <option value="mile">Mile</option>
                <option value="centimeter">Centimeter</option>
                <option value="meter">Meter</option>
                <option value="kilometer">Kilometer</option>
            </select><br>
            <label for="unit2">To Unit:</label><br>
            <select id="unit2" name="unit2">
                <option value="inch">Inch</option>
                <option value="foot">Foot</option>
                <option value="yard">Yard</option>
                <option value="mile">Mile</option>
                <option value="centimeter">Centimeter</option>
                <option value="meter">Meter</option>
                <option value="kilometer">Kilometer</option>
            </select><br>
            <button id="convert-btn" type="button">Convert</button>
            <p>
                <span id="convert-result"></span>
            </p>
            <script src="metric-converter.js" defer></script>
            </p>
    <div class="col" id="magic-eight-ball">
     <script src="magic-eight-ball.js" defer></script>﻿
     <link rel="stylesheet" href="css/magic-eight-ball.css">
     <h2 class="heading">Magic Eight Ball</h2>
      <form>
       <p>Type a yes/no question below, then click on the Eight Ball below to get your answer!</p>
       <input id="question" name="question" size="80">
       <button onclick="displayAnswer()">Submit</button>
       <div id="magicEightBall">
        <div id="circle"></div>
        <img id="ball" src="img\magic-eight-ball.png"/>
       </div>
       <button id="reset" name="reset" type="reset">Ask another question</button>
      </form>
      <br>
   </div>
